<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopping Cart | SHE Store</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="bootstrap.css">
        

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark purple-navbar">
      <div class="container">
        <a href="index.html" class="navbar-brand fw-bold">
          SHE <i class="bi bi-stars"></i>
        </a>

        <a href="index.html" class="btn btn-light">
          <i class="bi bi-arrow-left"></i> Continue Shopping
        </a>
      </div>
    </nav>

    <!-- Shopping Cart -->
    <main class="container py-5 mt-5">
      <h2 class="text-center mb-4">
        <i class="bi bi-cart3"></i> Shopping Cart
      </h2>

      <!-- Cart Items -->
      <div id="cartItems" class="mb-4"></div>

      <!-- Empty Cart Message -->
      <div id="emptyCart" class="text-center py-4">
        <i class="bi bi-cart-x empty-icon"></i>
        <h4 class="mt-3">Your cart is empty!</h4>
        <p>Add some products to your cart.</p>

        <a href="index.html" class="btn btn-primary"> Shop Now </a>
      </div>

      <!-- Cart Summary -->
      <div id="cartSummary" class="cart-summary p-4 mt-4">
        <h4 class="mb-3">Order Summary</h4>

        <p>
          Total Quantity:
          <strong id="totalQuantity">0</strong>
        </p>

        <p>
          Subtotal:
          <strong id="subtotal">$0.00</strong>
        </p>

        <hr />

        <h5>
          Final Total:
          <strong id="finalTotal" class="text-primary">$0.00</strong>
        </h5>

        <button id="clearCart" class="btn btn-outline-danger mt-3">
          <i class="bi bi-trash"></i> Clear Cart
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="text-white text-center py-3 mt-5">
      <div class="container">
        <h5 class="fw-bold">SHE <i class="bi bi-stars"></i></h5>
        <p class="mb-0">&copy; 2026 SHE Store. All rights reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="bootstrap.js"></script>
<!-- Shopping Cart JavaScript -->
      <script src="script.js"></script>
  </body>
</html>
