<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Shopping Cart</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="bootstrap.css" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="bi bi-bag-heart"></i>
          My Store
        </a>

        <a href="cart.html" class="nav-link">
          <i class="bi bi-cart3"></i>
          Cart 
        </a>
      </div>
    </nav>

    <main class="container py-5">
      <!-- Page Title -->
      <div class="text-center mb-5">
        <h1>Our Products</h1>
        <p class="text-muted">Shop, Choose and Add to your cart.</p>
      </div>

      <!-- Products -->
      <div class="row g-4" id="productsContainer">
        <!-- Product 1 -->
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card product-card h-100">
            <div class="product-icon">
              <i class="bi bi-gem"></i>
            </div>
            <div class="product-image">
              <img src="images/nail1.jpg" alt="Fake Nails" />
            </div>

            <div class="card-body text-center d-flex flex-column">
              <h5 class="card-title">Fake Nails</h5>
              <p class="text-muted">High-quality</p>
              <p class="price">$5.00</p>

              <button class="btn btn-primary add-to-cart" data-id="1">
                <i class="bi bi-cart-plus"></i>
                Add to Cart
              </button>
            </div>
          </div>
        </div>

        <!-- Product 2 -->
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card product-card h-100">
            <div class="product-icon">
              <i class="bi bi-droplet-half"></i>
            </div>
            <div class="product-image">
              <img src="images/nail2.jpeg" alt="Nail Polish" />
            </div>

            <div class="card-body text-center d-flex flex-column">
              <h5 class="card-title">Nail</h5>
              <p class="text-muted">Fall color</p>
              <p class="price">$8.00</p>

              <button class="btn btn-primary add-to-cart" data-id="2">
                <i class="bi bi-cart-plus"></i>
                Add to Cart
              </button>
            </div>
          </div>
        </div>

        <!-- Product 3 -->
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card product-card h-100">
            <div class="product-icon">
              <i class="bi bi-palette"></i>
            </div>
            <div class="product-image">
              <img src="images/nail22.jpg" alt="Nail Lacquer" />
            </div>

            <div class="card-body text-center d-flex flex-column">
              <h5 class="card-title">Nail Lacqeur</h5>
              <p class="text-muted">Perfect for everyday</p>
              <p class="price">$9.00</p>

              <button class="btn btn-primary add-to-cart" data-id="3">
                <i class="bi bi-cart-plus"></i>
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->

    <!-- Footer -->
    <footer class="text-white text-center py-3 mt-5">
      <div class="container">
        <h5 class="fw-bold">SHE <i class="bi bi-stars"></i></h5>
        <p class="mb-0">&copy; 2026 SHE Store. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
    <!-- Bootstrap JavaScript -->
    <script src="bootstrap.js"></script>
  </body>
</html>
